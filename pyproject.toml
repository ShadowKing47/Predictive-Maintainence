[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfp"
version = "0.1.0"
description = "Machine Failure Prediction - Predictive Maintenance ML System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.5",
    "scikit-learn==1.6.1",
    "tensorflow==2.21.0",
    "pandera==0.33.0",
    "pydantic==2.12.2",
    "pydantic-settings==2.11.0",
    "structlog==26.1.0",
    "typer==0.24.2",
    "pyyaml==6.0.3",
    "matplotlib==3.10.6",
    "mlflow==3.15.2",
    "dvc==3.67.1",
    "optuna==4.9.0",
    "shap==0.52.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "ruff==0.11.10",
    "black==26.3.1",
    "mypy==1.16.1",
    "pre-commit==4.2.0",
]
serve = [
    "fastapi==0.119.0",
    "uvicorn==0.37.0",
    "slowapi==0.1.9",
    "python-jose==3.5.0",
    "pyjwt==2.10.1",
    "redis==5.2.1",
    "tenacity==8.2.3",
    "pybreaker==1.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mfp*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "PTH"]
ignore = ["E501", "TRY003", "N803", "N806"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/mfp"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]