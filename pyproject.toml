[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfp"
version = "0.1.0"
description = "Machine Failure Prediction - Predictive Maintenance ML System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "tensorflow>=2.14",
    "pandera>=0.19",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
    "typer>=0.9",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "mlflow>=2.8",
    "dvc>=3.3",
    "optuna>=3.4",
    "shap>=0.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1",
    "black>=23.0",
    "mypy>=1.5",
    "pre-commit>=3.5",
    "k6>=0.1",
]
serve = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "slowapi>=0.1",
    "python-jose>=3.3",
    "pyjwt>=2.8",
    "redis>=5.0",
    "tenacity>=8.2",
    "pybreaker>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mfp*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20", "PTH"]
ignore = ["E501", "TRY003"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/mfp"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]